<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#343840" />
      <stop offset="35%" stop-color="#282a31" />
      <stop offset="70%" stop-color="#1f2025" />
      <stop offset="100%" stop-color="#18191d" />
    </radialGradient>

    <!-- Ambient Curved Light Accents in Background (Subtle abstract glows) -->
    <radialGradient id="ambientCornerGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#464b56" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#202227" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientBottomRight" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#464b56" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1c1d21" stop-opacity="0" />
    </radialGradient>

    <!-- Camera Body Matte Silver Material Gradient -->
    <linearGradient id="cameraMatte" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#f0f1f4" />
      <stop offset="45%" stop-color="#d8dae2" />
      <stop offset="100%" stop-color="#b6b9c3" />
    </linearGradient>

    <!-- Realistic Camera Drop Shadow -->
    <filter id="cameraShadow" x="-30%" y="-30%" width="160%" height="170%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="32" stdDeviation="28" flood-color="#07080a" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Lens Inner Shadow -->
    <filter id="lensDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#07080a" flood-opacity="0.75" />
    </filter>

    <!-- Outer Lens Ring Bevel -->
    <linearGradient id="lensOuterRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c404a" />
      <stop offset="100%" stop-color="#202227" />
    </linearGradient>

    <linearGradient id="lensGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2f37" />
      <stop offset="100%" stop-color="#15171a" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="800" fill="url(#bgGlow)" />
  <rect width="1200" height="800" fill="url(#ambientCornerGlow)" />
  <rect width="1200" height="800" fill="url(#ambientBottomRight)" />

  <!-- Subtle curved contours in corners as in the original photo -->
  <circle cx="100" cy="150" r="420" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.04" />
  <circle cx="1100" cy="700" r="480" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.03" />

  <!-- Centered 3D Camera with Shadow -->
  <g filter="url(#cameraShadow)">
    <!-- Combined Camera Body + Viewfinder Bump -->
    <path
      d="
        M 490 262
        C 508 262, 520 226, 542 222
        L 658 222
        C 680 226, 692 262, 710 262
        L 728 262
        C 760 262, 778 280, 778 312
        L 778 456
        C 778 488, 760 506, 728 506
        L 472 506
        C 440 506, 422 488, 422 456
        L 422 312
        C 422 280, 440 262, 472 262
        Z
      "
      fill="url(#cameraMatte)"
    />

    <!-- Camera Lens Assembly (Centered at x=600, y=384) -->
    <!-- Outer Dark Recessed Aperture -->
    <circle cx="600" cy="384" r="88" fill="url(#lensOuterRing)" filter="url(#lensDepth)" />

    <!-- Lens Middle Tone -->
    <circle cx="600" cy="384" r="74" fill="#1b1c20" />

    <!-- Glass Element Gradient -->
    <circle cx="600" cy="384" r="56" fill="url(#lensGlassGrad)" />
    <circle cx="600" cy="384" r="56" fill="none" stroke="#3e424c" stroke-width="2" />

    <!-- Deep Center Pupil -->
    <circle cx="600" cy="384" r="32" fill="#0f1013" />

    <!-- Subtle Optical Reflection Arc -->
    <path
      d="M 574 350 A 44 44 0 0 1 626 350"
      fill="none"
      stroke="#7c8290"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Flash Dot (top right of camera) -->
    <circle cx="734" cy="310" r="14" fill="#2d3037" />
    <circle cx="734" cy="310" r="14" fill="none" stroke="#202227" stroke-width="2" />
    <circle cx="732" cy="308" r="3" fill="#525763" opacity="0.6" />
  </g>

  <!-- Divider Horizontal Accent Lines -->
  <line x1="250" y1="602" x2="345" y2="602" stroke="#4e525d" stroke-width="1.8" stroke-linecap="round" />
  <line x1="855" y1="602" x2="950" y2="602" stroke="#4e525d" stroke-width="1.8" stroke-linecap="round" />

  <!-- Explanatory Typography (exact wording and casing from user's image) -->
  <g text-anchor="middle" fill="#d2d5dc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="594" font-size="25" font-weight="400" letter-spacing="0.3">
      Imagem meramente ilustrativa para
    </text>
    <text x="600" y="630" font-size="25" font-weight="400" letter-spacing="0.3">
      amostra do produto.
    </text>
  </g>
</svg>
